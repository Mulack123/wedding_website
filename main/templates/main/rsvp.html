{% extends "main/base.html" %}
{% block content %}
<main class="relative max-w-4xl mx-auto py-16 px-6 bg-white/80 text-black rounded-xl shadow-lg mt-10">
  <h1 class="text-4xl font-bold mb-2 text-center">RSVP</h1>
  <p class="text-center text-gray-600 mb-8">Welcome, {{ invite }}! Please let us know if you can make it.</p>
  <form class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4" action="/rsvp/" method="post">
    {% csrf_token %}
    <input type="hidden" name="step" value="rsvp">
    <input type="hidden" name="code" value="{{ code }}">
    {% for guest in guests %}
    <div class="mb-8 border-b pb-6 last:border-b-0">
      <h2 class="text-xl font-bold mb-4">{{ guest.name }}</h2>
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Attending?</label>
        <div class="flex gap-6">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="going_{{ guest.id }}" value="yes"
              {% if guest.rsvp.going %}checked{% endif %}
              class="accent-black">
            Yes
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="going_{{ guest.id }}" value="no"
              {% if guest.rsvp and not guest.rsvp.going %}checked{% endif %}
              class="accent-black">
            No
          </label>
        </div>
      </div>
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="dietary_{{ guest.id }}">Dietary Requirements</label>
        <textarea id="dietary_{{ guest.id }}" name="dietary_{{ guest.id }}" rows="2"
          placeholder="e.g. vegetarian, nut allergy — leave blank if none"
          class="border w-full form-input rounded px-3 py-2 text-gray-700">{% if guest.rsvp %}{{ guest.rsvp.dietary_requirements }}{% endif %}</textarea>
      </div>
    </div>
    {% endfor %}
    <input type="submit" value="Submit RSVP" class="w-full bg-black hover:bg-gray-800 text-white font-bold py-2 px-4 rounded cursor-pointer mt-2">
  </form>
</main>
{% endblock content %}
