{% extends "main/base.html" %}

{% block body_style %}background-color: white;{% endblock %}

{% block content %}

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

  <main class="max-w-6xl mx-auto py-16 px-4">
    <h1 class="text-4xl font-bold mb-8">Our Gallery</h1>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      {% for photo in photos %}
      <img src="{{ photo }}" alt="Wedding photo" class="rounded-lg shadow w-full object-cover" />
      {% empty %}
      <p class="col-span-3 text-gray-500">No photos yet — check back soon!</p>
      {% endfor %}
    </div>
  </main>

{% endblock content %}
