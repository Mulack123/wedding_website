{% extends "main/base.html" %}

{% block content %}

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-black font-serif">
  <main class="max-w-6xl mx-auto py-16 px-4">
    <h1 class="text-4xl font-bold mb-8">Our Gallery</h1>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      {% for image in images %} 
      <img src="{{image.link}}" alt="{{image.description}}" class="rounded-lg shadow" />
      {% endfor %}
    </div>
  </main>
</body>

{% endblock content %}
